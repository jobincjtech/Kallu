function parseDate(v){v=String(v).trim();if(!v)return null;if(/^\d+(\.\d+)?$/.test(v)){const n=Number(v);return n>20000&&n<80000?new Date(Math.round((n-25569)*864e5)):null;}let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12){const t=d;d=mo;mo=t;}if(mo<1||mo>12||d<1||d>31)return null;const dt=new Date(y,mo-1,d);return dt.getMonth()===mo-1?dt:null;}m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m){const dt=new Date(+m[1],+m[2]-1,+m[3]);return dt.getMonth()===+m[2]-1?dt:null;}const t=Date.parse(v);return Number.isNaN(t)?null:new Date(t);}

function newSeed(){return Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16)).join('-');}
const LOCK_KEY='jobin-emr-page-lock-v1';
function savedLock(){try{const raw=localStorage.getItem(LOCK_KEY);if(!raw)return null;const v=JSON.parse(raw);if(!v.salt||!v.hash)throw Error('Invalid password settings.');return v;}catch(e){if(e instanceof SyntaxError)throw Error('Password settings could not be read.');throw e;}}
const b64=bytes=>btoa(String.fromCharCode(...bytes));
const unb64=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
async function passwordHash(password,salt){if(!crypto.subtle)throw Error('Use a current Chrome, Edge, or Safari browser to enable the password lock.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},key,256));}
async function checkPassword(password,config){const h=await passwordHash(password,unb64(config.salt)),expected=unb64(config.hash);let diff=h.length^expected.length;for(let i=0;i<h.length;i++)diff|=h[i]^expected[i];return diff===0;}
async function savePassword(password){const salt=crypto.getRandomValues(new Uint8Array(16)),hash=await passwordHash(password,salt);try{localStorage.setItem(LOCK_KEY,JSON.stringify({salt:b64(salt),hash:b64(hash)}));}catch{throw Error('Your browser blocked password storage. Allow local storage for this file, then try again.');}}
function showGate(){clearTimeout(inactivity);let configured=false;try{configured=!!savedLock();}catch(e){toast(e.message);}$('#app').innerHTML=`<div class="gate"><section class="gate-card"><div class="brand gate-brand"><span class="logo">+</span><div><strong>EMR Utilisation</strong><small>Powered by Jobin Tech</small></div></div><h1>${configured?'Enter your password':'Create your password'}</h1><p>${configured?'Unlock the page to upload, review, and download doctor-wise patient records.':'Choose a password before opening this page. You will use it to unlock this HTML file in this browser.'}</p><form id="gate-form"><label>Password<div class="gate-password"><input id="gate-password" type="password" required ${configured?'':'minlength="12"'} autocomplete="${configured?'current-password':'new-password'}"><button type="button" id="show-password">Show</button></div></label>${configured?'':`<label>Confirm password<input id="confirm-password" type="password" minlength="12" required autocomplete="new-password"></label><small class="helper">Use at least 12 characters.</small>`}<p id="gate-error" class="error" role="alert"></p><button class="primary" id="gate-submit">${configured?'Unlock page':'Create password & open page'} →</button></form><p class="gate-note">Password settings are saved in this browser as a salted PBKDF2 hash. Patient data is not saved. This local page lock is not server authentication.</p></section></div>`;$('#show-password').onclick=()=>{const p=$('#gate-password');p.type=p.type==='password'?'text':'password';$('#show-password').textContent=p.type==='password'?'Show':'Hide';};$('#gate-form').onsubmit=async e=>{e.preventDefault();const button=$('#gate-submit');button.disabled=true;try{const password=$('#gate-password').value;if(configured){if(!await checkPassword(password,savedLock()))throw Error('Incorrect password. Please try again.');}else{if(password.length<12)throw Error('Use at least 12 characters.');if(password!==$('#confirm-password').value)throw Error('Passwords do not match.');await savePassword(password);}auth=true;render();resetIdle();}catch(e){$('#gate-error').textContent=e.message;}finally{button.disabled=false;}};$('#gate-password').focus();}
function lockPage(){auth=false;showGate();}
function resetIdle(){clearTimeout(inactivity);if(auth)inactivity=setTimeout(lockPage,20*60*1000);}
for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,()=>{if(auth)resetIdle();},{passive:true});
$('#ticker-track').innerHTML=Array(2).fill(Array(14).fill('<span>Jobin Tech</span><i>✦</i>').join('')).join('');
showGate();
