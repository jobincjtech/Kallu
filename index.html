<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>കല്ലൂസ് ANALYTICAL PRO</title>
<style>
:root{
  --navy:#040b1f; --navy2:#0a1a3f; --royal:#2457ff; --cyan:#22e4ff; --white:#f4f8ff;
  --glass:rgba(255,255,255,.06); --line:rgba(34,228,255,.25);
  --font:"Segoe UI","Nirmala UI","Noto Sans Malayalam","Manjari","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--white);background:radial-gradient(1200px 700px at 15% -10%,#123a8f55,transparent 60%),radial-gradient(900px 600px at 100% 100%,#0ab7d933,transparent 60%),linear-gradient(160deg,var(--navy),var(--navy2));background-attachment:fixed;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(34,228,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,228,255,.06) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);animation:gridmove 20s linear infinite}
@keyframes gridmove{to{background-position:56px 56px,56px 56px}}
.shape{position:fixed;z-index:0;pointer-events:none;border:1px solid var(--line);opacity:.5;animation:float 14s ease-in-out infinite}
.s1{width:160px;height:160px;top:18%;left:6%;border-radius:50%}
.s2{width:120px;height:120px;bottom:14%;right:8%;transform:rotate(45deg);animation-delay:-5s}
.s3{width:80px;height:80px;top:60%;left:12%;border-radius:18px;animation-delay:-9s}
@keyframes float{50%{translate:0 -28px;rotate:18deg}}

/* Ticker */
.ticker{position:relative;z-index:2;overflow:hidden;white-space:nowrap;padding:12px 0;background:linear-gradient(90deg,#06143a,#0b2a78,#06143a);border-bottom:1px solid var(--line);box-shadow:0 6px 30px #2457ff44}
.ticker::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(34,228,255,.07) 38px 39px);}
.track{display:inline-flex;will-change:transform;animation:scroll 22s linear infinite}
.track span{font-size:1.25rem;font-weight:800;letter-spacing:.18em;padding:0 2.2rem;color:var(--white);text-shadow:0 0 8px var(--cyan),0 0 22px var(--royal);position:relative}
.track span::after{content:"◆";color:var(--cyan);margin-left:2.2rem;font-size:.7em;vertical-align:middle}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Hero */
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(32px,6vw,72px) 20px;text-align:center}
.clock{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:1.4rem;padding:10px 26px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 30px #2457ff33}
#time{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--cyan);text-shadow:0 0 14px #22e4ffaa}
#date{font-size:.9rem;color:#b9cdf5;letter-spacing:.08em}
h1{font-size:clamp(2.2rem,7vw,5rem);line-height:1.25;font-weight:800;letter-spacing:.03em;max-width:100%}
h1 .ch{display:inline-block;white-space:pre;background:linear-gradient(180deg,#fff,var(--cyan) 60%,var(--royal));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:wave 2.8s ease-in-out infinite,hue 6s linear infinite;animation-delay:calc(var(--i)*.09s);filter:drop-shadow(0 0 10px #22e4ff88)}
@keyframes wave{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.07)}}
@keyframes hue{0%,100%{filter:drop-shadow(0 0 8px #22e4ff88)}50%{filter:drop-shadow(0 0 22px #2457ffee)}}
.sub{margin-top:1.1rem;font-size:clamp(.95rem,2vw,1.25rem);color:#b9cdf5;letter-spacing:.06em}
.sub b{color:var(--cyan);font-weight:400;margin:0 .5rem}
.cards{margin-top:clamp(32px,6vw,64px);display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:28px;justify-content:center;width:100%}
.card{position:relative;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:34px 30px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px #00000066,inset 0 1px 0 #ffffff22;transition:transform .35s,box-shadow .35s,border-color .35s;overflow:hidden}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--cyan),var(--royal),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;animation:spin 4s linear infinite paused}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.card:hover,.card:focus-visible{transform:translateY(-10px);border-color:var(--cyan);box-shadow:0 30px 70px #2457ff55,0 0 40px #22e4ff33,inset 0 1px 0 #ffffff33;outline:none}
.card:hover::before,.card:focus-visible::before{opacity:1;animation-play-state:running}
.ico{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--royal),var(--cyan));box-shadow:0 10px 30px #2457ff88;margin-bottom:22px;transition:transform .35s}
.card:hover .ico{transform:scale(1.08) rotate(-4deg)}
.ico svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{font-size:1.5rem;font-weight:700;margin-bottom:10px}
.card p{color:#b9cdf5;line-height:1.55;font-size:1rem}
.go{margin-top:22px;display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--cyan)}
.go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .3s}
.card:hover .go svg{transform:translateX(6px)}
.live{margin-left:auto;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;border:1px solid #22e4ff66;color:var(--cyan);background:#22e4ff14}.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:7px;box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.3}}.card.unset .live{display:none}.card h2{letter-spacing:.02em}.cards::before{content:"SELECT A MODULE";grid-column:1/-1;font-size:.8rem;letter-spacing:.35em;color:#7f9ad6}.soon{display:none;margin-left:auto;font-size:.75rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:#9fb6ea}
.card.unset .soon{display:inline-block}
.card .head{display:flex;align-items:flex-start}

/* Toast */
#toast{position:fixed;left:50%;bottom:90px;z-index:10;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:14px 26px;border-radius:16px;background:rgba(10,26,63,.92);border:1px solid var(--cyan);box-shadow:0 0 30px #22e4ff44;backdrop-filter:blur(10px);transition:.4s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

footer{position:relative;z-index:1;text-align:center;padding:22px 16px;border-top:1px solid var(--line);background:rgba(4,11,31,.6);backdrop-filter:blur(10px);font-size:.9rem;color:#9fb6ea}
footer strong{color:var(--white);display:block;margin-bottom:4px;letter-spacing:.08em}
footer strong em{font-style:normal;color:var(--cyan)}

/* Page-load */
.load{opacity:0;transform:translateY(24px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.7s}
@keyframes in{to{opacity:1;transform:none}}

@media(max-width:820px){.cards{grid-template-columns:minmax(0,420px)}.card{padding:28px 24px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.track{animation:scroll 40s linear infinite!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="grid"></div>
<div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>

<div class="ticker" aria-label="Jobin TECH">
  <div class="track" id="track"></div>
</div>

<main>
  <div class="clock load d1" aria-live="off"><span id="time">--:--:--</span><span id="date"></span></div>
  <h1 class="load d2" id="title" aria-label="കല്ലൂസ് ANALYTICAL PRO" data-text="കല്ലൂസ് ANALYTICAL PRO"></h1>
  <p class="sub load d2">Smart Analytics<b>|</b>Intelligent Insights<b>|</b>Advanced Reporting</p>

  <section class="cards">
    <button class="card load d3" id="btn-analytics" type="button" data-key="analytics">
      <div class="head">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx=".5"/><rect x="12" y="8" width="3" height="10" rx=".5"/><rect x="17" y="5" width="3" height="13" rx=".5"/></svg></div>
        <span class="live">Live</span><span class="soon">Coming soon</span>
      </div>
      <h2>DHA Analytics</h2>
      <p>Access DHA analytics, interactive dashboards and performance insights.</p>
      <span class="go">Open DHA Analytics <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </button>

    <button class="card load d4" id="btn-reports" type="button" data-key="reports">
      <div class="head">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8 17l2.5-3 2 2 3-4"/></svg></div>
        <span class="live">Live</span><span class="soon">Coming soon</span>
      </div>
      <h2>EMR Usability</h2>
      <p>Explore EMR usability reports, adoption metrics and intelligent insights.</p>
      <span class="go">Open EMR Usability <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </button>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<footer>
  <strong>Powered by <em>Jobin TECH</em></strong>
  © 2026 Kalloose Analytical Pro. All Rights Reserved.
</footer>

<script>
/* =====================================================
   CONFIGURATION — EDIT ONLY THIS BLOCK
   Use a file name (e.g. "DHA.html") or a full URL (https://...) between the quotes.
   Leave empty ("") to show the "Coming Soon" message.
   ===================================================== */
const PORTAL_CONFIG = {
  dhaAnalyticsURL: "DHA.html",   // DHA Analytics page
  emrUsabilityURL: "EMR_USABILITY.html"    // EMR Usability page
};
/* ================= END OF CONFIGURATION ================= */

(function(){
  var URLS = { analytics: PORTAL_CONFIG.dhaAnalyticsURL, reports: PORTAL_CONFIG.emrUsabilityURL };
  var NAMES = { analytics: "DHA Analytics", reports: "EMR Usability" };

  function valid(u){ return typeof u==="string" && u.trim()!=="" && !/^\s*(javascript|data|vbscript):/i.test(u); }

  var toast = document.getElementById("toast"), tt;
  function say(msg){ toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove("show"); }, 3200); }

  document.querySelectorAll(".card").forEach(function(c){
    var k = c.dataset.key, u = URLS[k];
    if(!valid(u)) c.classList.add("unset");
    c.addEventListener("click", function(){
      if(valid(u)){ window.open(u.trim(), "_blank", "noopener,noreferrer"); }
      else { say(NAMES[k] + " is coming soon. Please check back shortly."); }
    });
  });

  /* Animated heading: split into graphemes so Malayalam conjuncts stay intact */
  var h = document.getElementById("title"), txt = h.dataset.text, parts;
  if(window.Intl && Intl.Segmenter){ parts = Array.from(new Intl.Segmenter("ml",{granularity:"grapheme"}).segment(txt), function(x){return x.segment;}); }
  else { parts = txt.split(" ").map(function(w,i,a){return i<a.length-1?w+" ":w;}); }
  h.innerHTML = parts.map(function(c,i){ return '<span class="ch" aria-hidden="true" style="--i:'+i+'">'+c+'</span>'; }).join("");

  /* Live clock */
  var tEl = document.getElementById("time"), dEl = document.getElementById("date");
  function tick(){
    var n = new Date();
    tEl.textContent = n.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
    dEl.textContent = n.toLocaleDateString([], {weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  }
  tick(); setInterval(tick,1000);

  /* Scrolling header: duplicate content so the loop is seamless */
  var track = document.getElementById("track"), html = "";
  for(var i=0;i<16;i++) html += "<span>Jobin TECH</span>";
  track.innerHTML = html;

  /* Particles */
  var cv = document.getElementById("bg"), ctx = cv.getContext("2d"), W, H, P = [], DPR = Math.min(window.devicePixelRatio||1,2);
  function size(){
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var n = Math.min(70, Math.floor(W*H/18000));
    P = [];
    for(var i=0;i<n;i++) P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p = P[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle="rgba(34,228,255,.75)"; ctx.fill();
      for(var j=i+1;j<P.length;j++){
        var q = P[j], dx=p.x-q.x, dy=p.y-q.y, d=dx*dx+dy*dy;
        if(d<14000){ ctx.strokeStyle="rgba(36,87,255,"+(0.28*(1-d/14000))+")"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      }
    }
    requestAnimationFrame(draw);
  }
  size(); draw();
  var rt; addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(size,200); });
})();
</script>
</body>
</html>
